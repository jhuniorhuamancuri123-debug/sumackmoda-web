name: Sync Alegra cada 6 horas

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Correr sync completo
        run: |
          page=0

          while true; do
            echo "Sincronizando página $page..."

            response=$(curl -s "https://sumackmoda-web.vercel.app/api/sync?page=$page")

            echo "$response"

            if echo "$response" | grep -q '"hay_mas":false'; then
              echo "Sync completo en página $page"
              break
            fi

            page=$((page+1))
          done

          echo "Proceso finalizado correctamente"
          exit 0
